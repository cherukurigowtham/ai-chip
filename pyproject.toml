[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitnet-accel"
version = "3.0.0"
description = "Universal Multiplier-Free AI Silicon SDK, Frontier Model Compiler & Runtime"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Cherukuri Gowtham", email = "cherukurigowtham851@gmail.com" }
]
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.20.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Hardware :: Silicon Accelerator",
    "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://github.com/cherukurigowtham/ai-chip"
Documentation = "https://github.com/cherukurigowtham/ai-chip/tree/main/docs"
Repository = "https://github.com/cherukurigowtham/ai-chip.git"

[project.scripts]
bitnet = "bitnet_cli:main"
bitnet-cli = "bitnet_cli:main"
bitnet-server = "bitnet_server:main"
