<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="12" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
    Milestone 1 Silicon PPA: Baseline Binary PE vs. Ternary PE (Nangate 45nm)
  </text>
  <text x="450" y="64" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
    Bit-Exact Verified | Yosys Gate-Level Synthesis | 16-bit Activation, 32-bit Accumulator
  </text>

  <!-- Legend -->
  <rect x="270" y="85" width="16" height="16" rx="3" fill="#3b82f6"/>
  <text x="295" y="98" font-family="sans-serif" font-size="13" fill="#e2e8f0">Binary Baseline (16b x 16b MAC)</text>

  <rect x="520" y="85" width="16" height="16" rx="3" fill="#10b981"/>
  <text x="545" y="98" font-family="sans-serif" font-size="13" fill="#e2e8f0">Ternary PE (2b Add/Sub/Skip)</text>

  <!-- Metric 1: Total Cell Area -->
  <g transform="translate(60, 130)">
    <text x="0" y="18" font-family="sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">Total Cell Area (μm²)</text>
    <!-- Baseline Bar: 3939 um2 (scaled to 420px max) -->
    <rect x="220" y="0" width="420" height="24" rx="4" fill="url(#blueGrad)"/>
    <text x="650" y="17" font-family="monospace" font-size="13" font-weight="600" fill="#93c5fd">3939 μm²</text>
    <!-- Ternary Bar: 1017 um2 (scaled) -->
    <rect x="220" y="30" width="108" height="24" rx="4" fill="url(#emeraldGrad)"/>
    <text x="338" y="47" font-family="monospace" font-size="13" font-weight="600" fill="#6ee7b7">1017 μm² (-74.2%)</text>
  </g>

  <!-- Metric 2: Standard Cell Count -->
  <g transform="translate(60, 205)">
    <text x="0" y="18" font-family="sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">Gate / Cell Count</text>
    <rect x="220" y="0" width="420" height="24" rx="4" fill="url(#blueGrad)"/>
    <text x="650" y="17" font-family="monospace" font-size="13" font-weight="600" fill="#93c5fd">3926 cells</text>
    <rect x="220" y="30" width="94" height="24" rx="4" fill="url(#emeraldGrad)"/>
    <text x="324" y="47" font-family="monospace" font-size="13" font-weight="600" fill="#6ee7b7">883 cells (-77.5%)</text>
  </g>

  <!-- Metric 3: Critical Path Logic Delay -->
  <g transform="translate(60, 280)">
    <text x="0" y="18" font-family="sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">Logic Path Delay (ps)</text>
    <rect x="220" y="0" width="420" height="24" rx="4" fill="url(#blueGrad)"/>
    <text x="650" y="17" font-family="monospace" font-size="13" font-weight="600" fill="#93c5fd">993.3 ps</text>
    <rect x="220" y="30" width="204" height="24" rx="4" fill="url(#emeraldGrad)"/>
    <text x="434" y="47" font-family="monospace" font-size="13" font-weight="600" fill="#6ee7b7">483.1 ps (-51.4%)</text>
  </g>

  <!-- Metric 4: Weight Storage Width -->
  <g transform="translate(60, 355)">
    <text x="0" y="18" font-family="sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">Weight Bus / DFFs</text>
    <rect x="220" y="0" width="420" height="24" rx="4" fill="url(#blueGrad)"/>
    <text x="650" y="17" font-family="monospace" font-size="13" font-weight="600" fill="#93c5fd">16 bits</text>
    <rect x="220" y="30" width="52" height="24" rx="4" fill="url(#emeraldGrad)"/>
    <text x="282" y="47" font-family="monospace" font-size="13" font-weight="600" fill="#6ee7b7">2 bits (-87.5%)</text>
  </g>

  <!-- Footer summary cards -->
  <g transform="translate(60, 425)">
    <text x="0" y="15" font-family="sans-serif" font-size="12" fill="#94a3b8">
      Key Highlights: 74.2% Area Reduction • 8x Memory Traffic Compression • 1.58 GHz Fmax • 42.7% Skip Rate
    </text>
  </g>
</svg>
